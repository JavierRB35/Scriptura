name: Scriptura · capturas y actualización en emulador Android

on:
  push:
    branches: [feature/mapas-estudio-inicio-0-7-3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots-and-upgrade:
    if: github.ref == 'refs/heads/feature/mapas-estudio-inicio-0-7-3'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obtener código de la rama de diseño
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK 34
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar release candidata con firma real, solo rama propia
        env:
          SCRIPTURA_BUILD_CODE: '2000'
          SCRIPTURA_SIGN_RELEASE: 'true'
          SCRIPTURA_KEYSTORE_FILE: ${{ runner.temp }}/scriptura-release.jks
          SCRIPTURA_KEYSTORE_PASSWORD: ${{ secrets.SCRIPTURA_KEYSTORE_PASSWORD }}
          SCRIPTURA_KEY_PASSWORD: ${{ secrets.SCRIPTURA_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.SCRIPTURA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$SCRIPTURA_KEYSTORE_FILE"
          sh ./gradlew :app:assembleRelease --no-daemon --max-workers=1
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Descargar release anterior firmada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/scriptura-previous"
          gh release download v0.6.0-build.48 --repo ${{ github.repository }} \
            --pattern "Scriptura-0.6.0-build.48.apk" \
            --dir "$RUNNER_TEMP/scriptura-previous"

      - name: Comparar firma antes de instalar
        run: |
          set -euo pipefail
          VERIFY="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          OLD="$RUNNER_TEMP/scriptura-previous/Scriptura-0.6.0-build.48.apk"
          NEW="app/build/outputs/apk/release/app-release.apk"
          "$VERIFY" verify --print-certs "$OLD" > "$RUNNER_TEMP/old-signature.txt"
          "$VERIFY" verify --print-certs "$NEW" > "$RUNNER_TEMP/new-signature.txt"
          grep 'Signer #1 certificate SHA-256 digest' "$RUNNER_TEMP/old-signature.txt" > "$RUNNER_TEMP/old-cert.txt"
          grep 'Signer #1 certificate SHA-256 digest' "$RUNNER_TEMP/new-signature.txt" > "$RUNNER_TEMP/new-cert.txt"
          diff -u "$RUNNER_TEMP/old-cert.txt" "$RUNNER_TEMP/new-cert.txt"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          OLD_META="$("$AAPT" dump badging "$OLD" | grep '^package:')"
          NEW_META="$("$AAPT" dump badging "$NEW" | grep '^package:')"
          echo "Anterior: $OLD_META"
          echo "Candidata: $NEW_META"
          OLD_CODE="$(printf '%s' "$OLD_META" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")"
          NEW_CODE="$(printf '%s' "$NEW_META" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")"
          test -n "$OLD_CODE" && test -n "$NEW_CODE" && test "$NEW_CODE" -gt "$OLD_CODE"
          echo "CERTIFICADO FIRMA SIN CAMBIOS Y VERSIONCODE ASCENDENTE" >> "$GITHUB_STEP_SUMMARY"

      - name: Liberar espacio del runner antes de arrancar Android
        run: |
          set -euxo pipefail
          df -h /
          # Solo se eliminan herramientas del runner efímero que Scriptura no utiliza.
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo rm -rf "$ANDROID_HOME/ndk"
          df -h /

      - name: Habilitar aceleración KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capturar pantallas reales y verificar actualización sin borrar ajustes
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SCRIPTURA_PREVIOUS_APK: ${{ runner.temp }}/scriptura-previous/Scriptura-0.6.0-build.48.apk
          SCRIPTURA_CANDIDATE_APK: app/build/outputs/apk/release/app-release.apk
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 3072M
          sdcard-path-or-size: 256M
          ram-size: 1536M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 qa/capture_ui.py

      - name: Adjuntar capturas PNG y resultados de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Scriptura-v061-capturas-Android-reales
          path: |
            qa/screenshots/*.png
            qa/visual-qa-report.json
          if-no-files-found: warn
          retention-days: 30
