name: Scriptura · compilar y publicar APK firmada

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK 34 en el runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar Gradle Wrapper completo
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon --max-workers=1

      - name: Guardar Gradle Wrapper oficial en el repositorio
        run: |
          if ! git ls-files --error-unmatch gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradle/wrapper/gradle-wrapper.jar
            git commit -m "build: incluir gradle-wrapper.jar oficial 8.9"
            git push origin HEAD:main
          fi

      - name: Compilar versión de verificación
        run: sh ./gradlew :app:assembleDebug --no-daemon --max-workers=1

      - name: Probar referencias liturgicas y canon catolico
        run: sh ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1

      - name: Comprobar configuración de firma
        id: signing
        env:
          KEY_B64: ${{ secrets.SCRIPTURA_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SCRIPTURA_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SCRIPTURA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_PASS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$KEY_B64" ] && [ -z "$STORE_PASS" ] && [ -z "$KEY_PASS" ]; then
            echo "::warning::Firma pendiente: configurar los tres secretos. No se publicará ningún APK."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Configuración de firma incompleta: faltan uno o más secretos."
            exit 1
          fi

      - name: Restaurar keystore temporal
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_B64: ${{ secrets.SCRIPTURA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/scriptura"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/scriptura/scriptura-release.jks"

      - name: Compilar APK release firmada
        if: steps.signing.outputs.ready == 'true'
        env:
          SCRIPTURA_SIGN_RELEASE: 'true'
          SCRIPTURA_KEYSTORE_FILE: ${{ runner.temp }}/scriptura/scriptura-release.jks
          SCRIPTURA_KEYSTORE_PASSWORD: ${{ secrets.SCRIPTURA_KEYSTORE_PASSWORD }}
          SCRIPTURA_KEY_PASSWORD: ${{ secrets.SCRIPTURA_KEY_PASSWORD }}
        run: sh ./gradlew :app:assembleRelease --no-daemon --max-workers=1

      - name: Verificar firma del APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Preparar entrega
        if: steps.signing.outputs.ready == 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Scriptura-0.4.0-build.${GITHUB_RUN_NUMBER}.apk"

      - name: Guardar APK firmado en artefactos
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Scriptura-APK-firmado-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publicar versión preliminar descargable
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.4.0-build.${GITHUB_RUN_NUMBER}" "dist/Scriptura-0.4.0-build.${GITHUB_RUN_NUMBER}.apk" \
            --title "Scriptura 0.4.0 · compilación ${GITHUB_RUN_NUMBER}" \
            --notes "Versión preliminar de desarrollo. APK firmado para actualización sobre instalaciones anteriores firmadas con la misma clave." \
            --prerelease --target "$GITHUB_SHA"
