name: Scriptura · verificar copia SQLite en emulador

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/scriptura/app/ScripturaBackup.java'
      - 'app/src/debug/**'
      - '.github/workflows/android-backup-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de prueba
        run: sh ./gradlew :app:assembleDebug --no-daemon --max-workers=1

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar instantánea real en Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am broadcast -n com.scriptura.app/.BackupQaReceiver
            RESULT="$(adb shell run-as com.scriptura.app cat files/backup-qa-result.txt)"
            echo "$RESULT"
            case "$RESULT" in
              PASS:*) exit 0 ;;
              *) exit 1 ;;
            esac
