name: Scriptura · E2E selección Definir y enlaces
on:
  push:
    branches: [fix/definir-enlaces-verificados-0-7-5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-definitions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK 34
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tests y compilación de la variante debug
        run: |
          sh ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=1
          test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Liberar espacio del runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell "$ANDROID_HOME/ndk"
          df -h /
      - name: Preparar aceleración KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pulsación prolongada real y navegación de enlaces
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 3072M
          ram-size: 1536M
          sdcard-path-or-size: 256M
          heap-size: 256M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 qa/test_definitions.py
      - name: Adjuntar pruebas reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Scriptura-Definir-Android-E2E
          path: |
            qa/definitions_report.json
            qa/definitions_screenshot.png
            qa/definitions_dump.xml
          if-no-files-found: warn
          retention-days: 30
