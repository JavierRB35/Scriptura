name: Scriptura · APK firmado (solo compilación)

on:
  push:
    branches: ['build/author-logo-apk-20261101']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK Android 34
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Comprobar firma y recurso visual
        env:
          KEY_B64: ${{ secrets.SCRIPTURA_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SCRIPTURA_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SCRIPTURA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable-nodpi/creator_mark.png
          test -n "$KEY_B64" && test -n "$STORE_PASS" && test -n "$KEY_PASS"
          mkdir -p "$RUNNER_TEMP/scriptura"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/scriptura/scriptura-release.jks"
      - name: Compilar APK Release firmado (sin batería de tests)
        env:
          SCRIPTURA_BUILD_CODE: '158'
          SCRIPTURA_SIGN_RELEASE: 'true'
          SCRIPTURA_KEYSTORE_FILE: ${{ runner.temp }}/scriptura/scriptura-release.jks
          SCRIPTURA_KEYSTORE_PASSWORD: ${{ secrets.SCRIPTURA_KEYSTORE_PASSWORD }}
          SCRIPTURA_KEY_PASSWORD: ${{ secrets.SCRIPTURA_KEY_PASSWORD }}
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon --max-workers=1
          sh ./gradlew :app:assembleRelease --no-daemon --max-workers=1
      - name: Comprobar APK y firma
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Scriptura-0.7.9-build.158-author-logo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Scriptura-APK-firmado-autor-logo
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
