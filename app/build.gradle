plugins {
    id 'com.android.application'
}

android {
    namespace 'com.scriptura.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.scriptura.app"
        minSdk 26
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName = "0.2.0" + (System.getenv("GITHUB_RUN_NUMBER") ? "-build." + System.getenv("GITHUB_RUN_NUMBER") : "")
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("SCRIPTURA_KEYSTORE_FILE") ?: "../.signing/scriptura-release.jks")
            storePassword System.getenv("SCRIPTURA_KEYSTORE_PASSWORD") ?: ""
            keyAlias "scriptura"
            keyPassword System.getenv("SCRIPTURA_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("SCRIPTURA_SIGN_RELEASE") == "true") {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
